name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Lint & Type Check
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type Check (API)
        run: cd apps/api && npx tsc --noEmit
      - name: Lint (API)
        run: cd apps/api && npx eslint src/ --max-warnings 0 || true
      - name: Type Check (Web)
        run: cd apps/web && npx tsc --noEmit
      - name: Lint (Web)
        run: cd apps/web && npx eslint src/ --max-warnings 0 || true

  # Unit Tests
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate
      - name: Run Unit Tests (API)
        run: cd apps/api && npx vitest run --config vitest.config.ts
      - name: Run Component Tests (Web)
        run: cd apps/web && npx vitest run --config vitest.config.ts

  # E2E Tests with PostgreSQL + Redis
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: azatech
          POSTGRES_PASSWORD: azatech_secret
          POSTGRES_DB: azatech_shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://azatech:azatech_secret@localhost:5432/azatech_shop_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      CORS_ORIGINS: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate
      - name: Run Migrations
        run: cd apps/api && npx prisma migrate deploy
      - name: Run E2E Tests
        run: cd apps/api && npx vitest run --config vitest.e2e.config.ts

  # Build
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate
      - name: Build API
        run: cd apps/api && npm run build
      - name: Build Web
        run: cd apps/web && npm run build
